<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">ScanMagic şu an bakımda</title>
<desc id="d">Taranan bir belge, dönen dişliler ve ilerleme çubuğu içeren bakım çalışması animasyonu.</desc>
<style>
:root{--bg1:#FFF6E8;--bg2:#FFE6C7;--card:#FFFFFF;--ink:#1E1B4B;--mut:#6B6890;--line:#E6DDF7;--pilltx:#B45309;--paper:#FFFFFF;--ph:#C9BDF5}
@media (prefers-color-scheme:dark){:root{--bg1:#241F4A;--bg2:#17142B;--card:#2A2650;--ink:#F4F0FF;--mut:#B3AEDB;--line:#3D3870;--pilltx:#FDBA74;--paper:#F4F0FF;--ph:#8C7CE0}}
text{font-family:Poppins,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.beam{animation:scan 3.2s ease-in-out infinite alternate}
@keyframes scan{from{transform:translateY(0)}to{transform:translateY(210px)}}
.tint{transform-box:fill-box;transform-origin:50% 0;animation:fill 3.2s ease-in-out infinite alternate}
@keyframes fill{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.g1{transform-box:fill-box;transform-origin:50% 50%;animation:spin 9s linear infinite}
.g2{transform-box:fill-box;transform-origin:50% 50%;animation:spin 6s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.tw{transform-box:fill-box;transform-origin:50% 50%;animation:tw 2.6s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.2;transform:scale(.55)}50%{opacity:1;transform:scale(1)}}
.pulse{transform-box:fill-box;transform-origin:50% 50%;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.6)}}
.ind{animation:ind 2.2s ease-in-out infinite}
@keyframes ind{from{transform:translateX(-130px)}to{transform:translateX(390px)}}
.d1,.d2,.d3{animation:dot 1.4s ease-in-out infinite}.d2{animation-delay:.2s}.d3{animation-delay:.4s}
@keyframes dot{0%,80%,100%{opacity:.2}40%{opacity:1}}
.float{animation:float 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.tint{transform:scaleY(1)}}
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--bg1)"/><stop offset="1" style="stop-color:var(--bg2)"/></linearGradient>
  <linearGradient id="pu" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#5B2EE0"/></linearGradient>
  <linearGradient id="or" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFB14A"/><stop offset="1" stop-color="#FF7A00"/></linearGradient>
  <linearGradient id="bm" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF8A1F" stop-opacity="0"/><stop offset=".5" stop-color="#FF8A1F"/><stop offset="1" stop-color="#FF8A1F" stop-opacity="0"/></linearGradient>
  <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7C4DFF"/><stop offset="1" stop-color="#FF8A1F"/></linearGradient>
  <filter id="glow" x="-20%" y="-300%" width="140%" height="700%"><feGaussianBlur stdDeviation="5"/></filter>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#3B1F9A" flood-opacity=".22"/></filter>
  <clipPath id="docclip"><rect x="60" y="50" width="190" height="230" rx="14"/></clipPath>
  <clipPath id="barclip"><rect x="440" y="258" width="380" height="10" rx="5"/></clipPath>
  <path id="sp" d="M0,-10 Q1.5,-1.5 10,0 Q1.5,1.5 0,10 Q-1.5,1.5 -10,0 Q-1.5,-1.5 0,-10Z"/>
</defs>

<rect x="6" y="6" width="888" height="308" rx="26" fill="url(#bg)" style="stroke:var(--line)" stroke-width="2"/>

<!-- Belge + tarama -->
<g filter="url(#sh)"><rect x="60" y="50" width="190" height="230" rx="14" style="fill:var(--paper)"/></g>
<g clip-path="url(#docclip)">
  <rect x="78" y="76" width="96" height="10" rx="5" style="fill:var(--ink)" opacity=".85"/>
  <rect x="78" y="94" width="60" height="6" rx="3" style="fill:var(--mut)" opacity=".5"/>
  <rect x="78" y="114" width="58" height="46" rx="8" style="fill:var(--ph)" opacity=".75"/>
  <rect x="146" y="118" width="86" height="6" rx="3" style="fill:var(--line)"/>
  <rect x="146" y="132" width="74" height="6" rx="3" style="fill:var(--line)"/>
  <rect x="146" y="146" width="86" height="6" rx="3" style="fill:var(--line)"/>
  <rect x="78" y="178" width="154" height="6" rx="3" fill="var(--line)"/><rect x="78" y="192" width="154" height="6" rx="3" fill="var(--line)"/><rect x="78" y="206" width="120" height="6" rx="3" fill="var(--line)"/><rect x="78" y="220" width="154" height="6" rx="3" fill="var(--line)"/><rect x="78" y="234" width="98" height="6" rx="3" fill="var(--line)"/><rect x="78" y="248" width="140" height="6" rx="3" fill="var(--line)"/><rect x="78" y="262" width="110" height="6" rx="3" fill="var(--line)"/>
  <rect class="tint" x="60" y="56" width="190" height="216" fill="#FF8A1F" opacity=".14"/>
  <g class="beam">
    <rect x="50" y="53" width="210" height="12" fill="#FF8A1F" opacity=".55" filter="url(#glow)"/>
    <rect x="50" y="56" width="210" height="4" rx="2" fill="url(#bm)"/>
  </g>
</g>
<rect x="60" y="50" width="190" height="230" rx="14" fill="none" style="stroke:var(--line)" stroke-width="1.5"/>

<!-- Dişliler -->
<g class="float">
  <path class="g1" d="M361.6,190.2 L371.8,191.8 L371.8,200.2 L361.6,201.8 L359.2,210.7 L367.2,217.3 L363.1,224.5 L353.3,220.8 L346.8,227.3 L350.5,237.1 L343.3,241.2 L336.7,233.2 L327.8,235.6 L326.2,245.8 L317.8,245.8 L316.2,235.6 L307.3,233.2 L300.7,241.2 L293.5,237.1 L297.2,227.3 L290.7,220.8 L280.9,224.5 L276.8,217.3 L284.8,210.7 L282.4,201.8 L272.2,200.2 L272.2,191.8 L282.4,190.2 L284.8,181.3 L276.8,174.7 L280.9,167.5 L290.7,171.2 L297.2,164.7 L293.5,154.9 L300.7,150.8 L307.3,158.8 L316.2,156.4 L317.8,146.2 L326.2,146.2 L327.8,156.4 L336.7,158.8 L343.3,150.8 L350.5,154.9 L346.8,164.7 L353.3,171.2 L363.1,167.5 L367.2,174.7 L359.2,181.3Z M336.0,196.0 a14,14 0 1,0 -28,0 a14,14 0 1,0 28,0Z" fill="url(#pu)" fill-rule="evenodd"/>
  <circle cx="322" cy="196" r="4" fill="url(#pu)"/>
  <path class="g2" d="M408.4,147.6 L415.8,149.1 L415.8,157.4 L408.4,158.9 L405.0,167.2 L409.1,173.5 L403.3,179.3 L397.0,175.2 L388.7,178.6 L387.2,186.0 L378.9,186.0 L377.4,178.6 L369.1,175.2 L362.8,179.3 L357.0,173.5 L361.1,167.2 L357.7,158.9 L350.3,157.4 L350.3,149.1 L357.7,147.6 L361.1,139.3 L357.0,133.0 L362.8,127.2 L369.1,131.3 L377.4,127.9 L378.9,120.5 L387.2,120.5 L388.7,127.9 L397.0,131.3 L403.3,127.2 L409.1,133.0 L405.0,139.3Z M392.0,153.3 a9,9 0 1,0 -18,0 a9,9 0 1,0 18,0Z" fill="url(#or)" fill-rule="evenodd"/>
</g>

<!-- Metin sütunu -->
<rect x="440" y="38" width="34" height="34" rx="10" fill="url(#pu)"/>
<use href="#sp" x="457" y="55" fill="#FFFFFF" transform="translate(457 55) scale(.95) translate(-457 -55)"/>
<text x="484" y="63" font-size="22" font-weight="800" fill="#6D3BF2">ScanMagic</text>

<rect x="440" y="86" width="178" height="28" rx="14" fill="#FF8A1F" opacity=".16"/>
<rect x="440" y="86" width="178" height="28" rx="14" fill="none" stroke="#FF8A1F" stroke-width="1.5"/>
<circle class="pulse" cx="457" cy="100" r="4.5" fill="#FF8A1F"/>
<text x="470" y="104.5" font-size="12" font-weight="700" letter-spacing="1.2" style="fill:var(--pilltx)">BAKIM ÇALIŞMASI</text>

<text x="440" y="168" font-size="38" font-weight="800" style="fill:var(--ink)">Şu an <tspan fill="#6D3BF2">bakımdayız</tspan></text>
<text x="440" y="198" font-size="14.5" style="fill:var(--mut)">ScanMagic daha hızlı ve daha güçlü olmak için</text>
<text x="440" y="219" font-size="14.5" style="fill:var(--mut)">güncelleniyor. Çok yakında geri döneceğiz!</text>

<text x="440" y="248" font-size="12.5" font-weight="600" style="fill:var(--ink)">Güncelleniyor</text>
<circle class="d1" cx="552" cy="244" r="2.2" style="fill:var(--ink)"/><circle class="d2" cx="560" cy="244" r="2.2" style="fill:var(--ink)"/><circle class="d3" cx="568" cy="244" r="2.2" style="fill:var(--ink)"/>
<rect x="440" y="258" width="380" height="10" rx="5" style="fill:var(--line)"/>
<g clip-path="url(#barclip)"><rect class="ind" x="440" y="258" width="130" height="10" rx="5" fill="url(#bar)"/></g>

<!-- Parıltılar -->
<use class="tw" href="#sp" x="402" y="48" fill="#FF8A1F"/>
<use class="tw" href="#sp" x="858" y="52" fill="#7C4DFF" style="animation-delay:.8s" transform="translate(858 52) scale(.8) translate(-858 -52)"/>
<use class="tw" href="#sp" x="276" y="44" fill="#A78BFA" style="animation-delay:1.4s" transform="translate(276 44) scale(.7) translate(-276 -44)"/>
<use class="tw" href="#sp" x="862" y="282" fill="#FF8A1F" style="animation-delay:.4s" transform="translate(862 282) scale(.9) translate(-862 -282)"/>
<use class="tw" href="#sp" x="400" y="286" fill="#7C4DFF" style="animation-delay:1.9s" transform="translate(400 286) scale(.65) translate(-400 -286)"/>
</svg>
