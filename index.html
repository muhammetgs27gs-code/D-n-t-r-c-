<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover: Android/iOS çentik ve gezinme çubuğu alanlarına taşabilmek için (Capacitor için önemli).
       style.css içindeki env(safe-area-inset-*) değerleri içeriği güvenli alanda tutar. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFF6E8">
  <title>ScanMagic — Tarayıcı Efekti ve Dönüştürücü</title>

  <!-- Poppins yazı tipi (mockup'taki tipografi) -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS (CDN). NOT: Capacitor'a aktarırken CDN yerine Tailwind CLI ile derlenmiş
       bir CSS dosyası kullanmanız önerilir (çevrimdışı çalışma + performans). -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    // Mockup'taki ScanMagic renk paleti
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { orange: '#FF8A1F', purple: '#6D3BF2', lilac: '#A78BFA', cream: '#FFF6E8', ink: '#1E1B4B' }
          },
          fontFamily: { sans: ['Poppins', 'system-ui', 'sans-serif'] }
        }
      }
    };
  </script>

  <link rel="stylesheet" href="style.css">

  <!-- Harici kütüphaneler (defer: sırayla yüklenir, app.js en sonda çalışır) -->
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
  <script defer src="app.js"></script>
</head>

<body class="bg-brand-cream font-sans text-brand-ink antialiased">

  <!-- ÜST BAŞLIK -->
  <header class="mx-auto flex max-w-xl items-center gap-3 px-4 pb-2 pt-5">
    <div class="grid h-10 w-10 place-items-center rounded-xl bg-gradient-to-br from-brand-purple to-brand-orange text-xl text-white" aria-hidden="true">✦</div>
    <div>
      <h1 class="text-xl font-extrabold leading-tight text-brand-purple">ScanMagic</h1>
      <p class="text-xs text-brand-ink/70">Dijital dosyalarını, gerçek bir belgeye dönüştür!</p>
    </div>
  </header>

  <main class="mx-auto max-w-xl space-y-5 px-4 pb-28 pt-3">

    <!-- ADIM 1: DOSYA YÜKLEME ALANI (sürükle-bırak + dokunarak seç) -->
    <section aria-labelledby="uploadTitle">
      <h2 id="uploadTitle" class="sr-only">Dosya yükle</h2>

      <!-- label içindeki gizli input sayesinde tıklama ve klavye (Enter/Space) erişilebilirliği ücretsiz gelir -->
      <label id="dropzone"
             class="flex min-h-[180px] cursor-pointer flex-col items-center justify-center gap-2 rounded-3xl border-2 border-dashed border-brand-lilac bg-white/70 p-6 text-center shadow-sm transition focus-within:ring-4 focus-within:ring-brand-lilac/50">
        <span class="text-4xl" aria-hidden="true">📄</span>
        <span class="text-base font-semibold">Dosyanı buraya sürükle</span>
        <span class="text-sm text-brand-ink/70">veya dokunup seç — PDF, JPG, PNG</span>
        <input id="fileInput" type="file" accept=".pdf,application/pdf,image/jpeg,image/png" class="sr-only">
      </label>

      <!-- Kamera ile çekim: mobilde arka kamerayı açar (Capacitor WebView'de de çalışır) -->
      <label class="mt-3 flex min-h-[48px] cursor-pointer items-center justify-center gap-2 rounded-2xl bg-gradient-to-br from-brand-purple to-[#5B2EE0] px-4 text-sm font-semibold text-white shadow focus-within:ring-4 focus-within:ring-brand-lilac/50">
        <span aria-hidden="true">📷</span> Kamera ile Tara
        <input id="cameraInput" type="file" accept="image/*" capture="environment" class="sr-only">
      </label>
    </section>

    <!-- STÜDYO: dosya yüklenince görünür -->
    <div id="studio" class="hidden space-y-5">

      <!-- ÖNİZLEME -->
      <section class="rounded-3xl bg-white p-4 shadow-md" aria-labelledby="prevTitle">
        <div class="mb-3 flex items-center justify-between gap-2">
          <h2 id="prevTitle" class="text-base font-bold">Önizleme</h2>
          <!-- Orijinal / Taranmış karşılaştırma -->
          <div class="inline-flex rounded-xl bg-brand-cream p-1" role="group" aria-label="Görünüm">
            <button type="button" data-view="scanned" class="view-btn min-h-[44px] min-w-[44px] rounded-lg px-3 text-sm font-semibold">Taranmış</button>
            <button type="button" data-view="original" class="view-btn min-h-[44px] min-w-[44px] rounded-lg px-3 text-sm font-semibold">Orijinal</button>
          </div>
        </div>

        <!-- Çok sayfalı PDF'lerde sayfa seçimi (ilk sayfa varsayılan) -->
        <div id="pageRow" class="mb-3 hidden items-center gap-3 text-sm">
          <label for="pageNo" class="font-medium">PDF sayfası</label>
          <input id="pageNo" type="number" min="1" value="1" inputmode="numeric"
                 class="h-11 w-20 rounded-xl border border-brand-lilac/60 bg-white px-3 text-center">
          <span id="pageTotal" class="text-brand-ink/60"></span>
        </div>

        <div class="overflow-hidden rounded-xl bg-neutral-200 p-2">
          <canvas id="preview" class="mx-auto block h-auto max-w-full rounded shadow-lg" aria-label="Belge önizlemesi"></canvas>
        </div>
      </section>

      <!-- ADIM 2: EFEKT KONTROLLERİ -->
      <section class="space-y-4 rounded-3xl bg-white p-4 shadow-md" aria-labelledby="fxTitle">
        <h2 id="fxTitle" class="text-base font-bold">Tarayıcı Efekti</h2>

        <div>
          <div class="flex justify-between text-sm"><label for="thr" class="font-medium">Kontrast / Eşik</label><output data-out="threshold" class="font-semibold text-brand-purple"></output></div>
          <input id="thr" data-param="threshold" type="range" min="60" max="220" step="1" value="150" class="h-11 w-full accent-[#6D3BF2]">
          <p class="text-xs text-brand-ink/60">Yükseldikçe yazı koyulaşır, düştükçe arka plan beyazlaşır.</p>
        </div>

        <div>
          <div class="flex justify-between text-sm"><label for="noise" class="font-medium">Gren (gürültü)</label><output data-out="noise" class="font-semibold text-brand-purple"></output></div>
          <input id="noise" data-param="noise" type="range" min="0" max="15" step="0.5" value="5" class="h-11 w-full accent-[#6D3BF2]">
        </div>

        <div>
          <div class="flex justify-between text-sm"><label for="blur" class="font-medium">Bulanıklık</label><output data-out="blur" class="font-semibold text-brand-purple"></output></div>
          <input id="blur" data-param="blur" type="range" min="0" max="3" step="0.1" value="1" class="h-11 w-full accent-[#6D3BF2]">
        </div>

        <div>
          <div class="flex justify-between text-sm"><label for="dpi" class="font-medium">Tarama kalitesi</label><output data-out="dpi" class="font-semibold text-brand-purple"></output></div>
          <input id="dpi" data-param="dpi" type="range" min="100" max="200" step="10" value="150" class="h-11 w-full accent-[#6D3BF2]">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label for="shadowSide" class="mb-1 block text-sm font-medium">Cilt gölgesi</label>
            <select id="shadowSide" data-param="shadowSide" class="h-11 w-full rounded-xl border border-brand-lilac/60 bg-white px-3 text-sm">
              <option value="left">Sol kenar</option>
              <option value="right">Sağ kenar</option>
              <option value="none">Yok</option>
            </select>
          </div>
          <div>
            <div class="mb-1 flex justify-between text-sm"><label for="shadowStrength" class="font-medium">Gölge</label><output data-out="shadowStrength" class="font-semibold text-brand-purple"></output></div>
            <input id="shadowStrength" data-param="shadowStrength" type="range" min="0" max="60" step="1" value="30" class="h-11 w-full accent-[#6D3BF2]">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3 pt-1">
          <button id="rerollBtn" type="button" class="min-h-[48px] rounded-2xl border border-brand-lilac bg-brand-cream px-3 text-sm font-semibold">🎲 Eğriliği / Grenı Yenile</button>
          <button id="resetBtn" type="button" class="min-h-[48px] rounded-2xl border border-brand-lilac bg-white px-3 text-sm font-semibold">↺ Varsayılanlar</button>
        </div>
      </section>

      <!-- ADIM 3: DIŞA AKTARMA -->
      <section class="space-y-3 rounded-3xl bg-white p-4 shadow-md" aria-labelledby="outTitle">
        <h2 id="outTitle" class="text-base font-bold">Dışa Aktar</h2>

        <button id="pdfBtn" type="button" class="flex min-h-[56px] w-full items-center gap-3 rounded-2xl bg-gradient-to-r from-[#7C4DFF] to-[#5B2EE0] px-4 text-left text-white shadow">
          <span class="text-2xl" aria-hidden="true">📑</span>
          <span><b class="block text-sm font-semibold">PDF Olarak İndir</b><small class="text-xs opacity-80">A4 boyutunda, tek sayfa</small></span>
        </button>

        <button id="jpgBtn" type="button" class="flex min-h-[56px] w-full items-center gap-3 rounded-2xl bg-gradient-to-r from-[#FF9A2E] to-[#FF7A00] px-4 text-left text-white shadow">
          <span class="text-2xl" aria-hidden="true">🖼️</span>
          <span><b class="block text-sm font-semibold">JPG Olarak İndir</b><small class="text-xs opacity-80">%80 kalite</small></span>
        </button>

        <button id="ocrBtn" type="button" class="flex min-h-[56px] w-full items-center gap-3 rounded-2xl bg-gradient-to-r from-[#4527d8] to-[#2a1a9e] px-4 text-left text-white shadow">
          <span class="text-2xl" aria-hidden="true">🔠</span>
          <span><b class="block text-sm font-semibold">Metni Çıkar (OCR)</b><small class="text-xs opacity-80">Türkçe + İngilizce, TXT olarak</small></span>
        </button>

        <label class="flex min-h-[44px] items-center gap-3 text-sm">
          <input id="ocrOriginal" type="checkbox" class="h-5 w-5 accent-[#6D3BF2]">
          OCR için orijinal görüntüyü kullan (daha doğru sonuç verir)
        </label>
      </section>
    </div>
  </main>

  <!-- "Processing..." YÜKLEME KATMANI -->
  <div id="loader" class="fixed inset-0 z-50 hidden items-center justify-center bg-brand-ink/60 p-6" role="alert" aria-live="assertive">
    <div class="w-full max-w-xs rounded-3xl bg-white p-6 text-center shadow-2xl">
      <div class="mx-auto h-12 w-12 animate-spin rounded-full border-4 border-brand-lilac border-t-brand-orange"></div>
      <p id="loaderText" class="mt-4 text-sm font-semibold">İşleniyor…</p>
      <div id="loaderBarWrap" class="mt-3 hidden h-2 overflow-hidden rounded-full bg-brand-lilac/30">
        <div id="loaderBar" class="h-full w-0 rounded-full bg-gradient-to-r from-brand-purple to-brand-lilac transition-all"></div>
      </div>
    </div>
  </div>

  <!-- Bildirim (toast) -->
  <div id="toast" class="pointer-events-none fixed inset-x-4 bottom-6 z-50 mx-auto hidden max-w-sm rounded-2xl bg-brand-ink px-4 py-3 text-center text-sm font-medium text-white shadow-xl" role="status" aria-live="polite"></div>

</body>
</html>
